<form class="contact-form" data-request="{{ __SELF__ }}::onFormSubmit" data-request-validate data-request-flash novalidate>
    {{ form_token() }}
    <div id="{{ __SELF__ }}_forms_flash"></div>

    <div class="contact-form__grid">
        <label class="contact-field">
            <span class="contact-field__label">Име</span>
            <input class="contact-field__input" type="text" name="name" autocomplete="name" placeholder="Вашето име" aria-required="true">
            <span class="field-error" data-validate-for="name"></span>
        </label>
        <label class="contact-field">
            <span class="contact-field__label">Е-маил</span>
            <input class="contact-field__input" type="email" name="email" autocomplete="email" placeholder="ime@email.com" aria-required="true">
            <span class="field-error" data-validate-for="email"></span>
        </label>
    </div>

    <label class="contact-field">
        <span class="contact-field__label">Наслов</span>
        <input class="contact-field__input" type="text" name="subject" placeholder="За што се работи?" aria-required="true">
        <span class="field-error" data-validate-for="subject"></span>
    </label>

    <label class="contact-field">
        <span class="contact-field__label">Порака</span>
        <textarea class="contact-field__input contact-field__input--area" name="message" rows="6" placeholder="Напишете ја вашата порака…" aria-required="true"></textarea>
        <span class="field-error" data-validate-for="message"></span>
    </label>

    <div class="contact-form__captcha">
        {% partial '@recaptcha' %}
        <span class="field-error" data-validate-for="g-recaptcha-response"></span>
    </div>

    <div class="contact-form__actions">
        <button class="btn contact-form__submit" type="submit">
            Испрати порака
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor" d="M3.4 20.6 21 12 3.4 3.4l-.1 6.7L14 12 3.3 13.9z"/>
            </svg>
        </button>
    </div>
</form>
