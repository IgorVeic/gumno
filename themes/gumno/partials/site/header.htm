description = "Site header"
==
<header class="site-header">
    <div class="shell site-header__inner">
        <a class="brand" href="{{ 'home'|page }}" aria-label="Гумно почетна">
            <img src="{{ 'assets/images/LogoGumno.png'|theme }}" width="160" height="38" alt="Гумно" decoding="async">
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-mobile" data-nav-toggle>
            <span class="nav-toggle__bars" aria-hidden="true">
                <span class="nav-toggle__bar"></span>
                <span class="nav-toggle__bar"></span>
                <span class="nav-toggle__bar"></span>
            </span>
            <span class="visually-hidden">Мени</span>
        </button>
        <nav id="site-nav" class="site-nav site-nav--desktop" aria-label="Главна навигација">
            <div class="site-nav__links">
                <a href="{{ 'home'|page }}" class="{{ this.page.id == 'home' ? 'is-active' }}">Почетна</a>
                <a href="{{ 'proizvodstvo/index'|page }}" class="{{ this.page.id starts with 'proizvodstvo/' ? 'is-active' }}">Производство</a>
                <a href="{{ 'katalog/index'|page }}" class="{{ this.page.id starts with 'katalog/' ? 'is-active' }}">Каталог</a>
                <a href="{{ 'brendovi/index'|page }}" class="{{ this.page.id starts with 'brendovi/' ? 'is-active' }}">Брендови</a>
                <a href="{{ 'maloprodazba/index'|page }}" class="{{ this.page.id starts with 'maloprodazba/' ? 'is-active' }}">Малопродажба</a>
                <a href="{{ 'za-nas'|page }}" class="{{ this.page.id == 'za-nas' ? 'is-active' }}">За нас</a>
                <a href="{{ 'kontakt'|page }}" class="{{ this.page.id == 'kontakt' ? 'is-active' }} site-nav__cta">Контакт</a>
            </div>
        </nav>
    </div>
</header>
<div class="nav-scrim" data-nav-scrim hidden></div>
<nav id="site-nav-mobile" class="site-nav site-nav--mobile" data-nav aria-label="Главна навигација">
    <div class="site-nav__sheet">
        <div class="site-nav__head">
            <p class="site-nav__eyebrow">Навигација</p>
        </div>
        <div class="site-nav__links">
            <a href="{{ 'home'|page }}" class="{{ this.page.id == 'home' ? 'is-active' }}">Почетна</a>
            <a href="{{ 'proizvodstvo/index'|page }}" class="{{ this.page.id starts with 'proizvodstvo/' ? 'is-active' }}">Производство</a>
            <a href="{{ 'katalog/index'|page }}" class="{{ this.page.id starts with 'katalog/' ? 'is-active' }}">Каталог</a>
            <a href="{{ 'brendovi/index'|page }}" class="{{ this.page.id starts with 'brendovi/' ? 'is-active' }}">Брендови</a>
            <a href="{{ 'maloprodazba/index'|page }}" class="{{ this.page.id starts with 'maloprodazba/' ? 'is-active' }}">Малопродажба</a>
            <a href="{{ 'za-nas'|page }}" class="{{ this.page.id == 'za-nas' ? 'is-active' }}">За нас</a>
            <a href="{{ 'kontakt'|page }}" class="{{ this.page.id == 'kontakt' ? 'is-active' }} site-nav__cta">Контакт</a>
        </div>
        <div class="site-nav__foot">
            <a class="site-nav__phone" href="tel:+38970225587">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.6 1 1 0 0 1-.25 1z"/>
                </svg>
                <span>{{ this.theme.phone_main|default('070 225 587') }}</span>
            </a>
            <p class="site-nav__meta">Гумно Охрид · од 1991</p>
        </div>
    </div>
</nav>
